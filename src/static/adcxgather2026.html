<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hi-Audio ADCx</title>
    <style>
        :root { --ink: #212529; --muted: #495057; --blue: #0056b3; --glow: #ffd54a; --line: #dee2e6; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        header.bar { display: flex; align-items: center; justify-content: space-between; padding: .5rem 1rem;
            background: #f8f9fa; border-bottom: 1px solid var(--line); }
        .bar-brand-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; }
        .brand { font-weight: 800; font-size: 1.35rem; letter-spacing: .02em; color: #1c1446; }
        .brand-link { text-decoration: none; }
        .brand span { color: #1a73e8; }
        .bar-description { color: var(--muted); font-size: .875rem; }
        .bar small { color: var(--muted); }
        main { max-width: 1040px; margin: 0 auto; padding: 1rem; }
        .mock-note { background: #fff3cd; border: 1px solid #ffe08a; color: #664d03; border-radius: .25rem;
            padding: .4rem .75rem; font-size: .875rem; margin-bottom: .75rem; }
        h1 { font-size: 1.4rem; margin: .1rem 0; }
        .intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .25rem 1rem; }
        .lead { color: var(--muted); }
        .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 .75rem; }
        .btn { font: inherit; font-size: .95rem; border: 1px solid var(--blue); color: var(--blue); background: #fff;
            border-radius: .25rem; padding: .35rem .75rem; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #eef4fb; }
        .btn[aria-pressed="true"], .btn-primary { background: var(--blue); color: #fff; }
        a { color: var(--blue); }
        a[target="_blank"]::after { content: "\00a0\2197\FE0E"; content: "\00a0\2197\FE0E" / ""; }
        :focus-visible { outline: 3px solid #212529; outline-offset: 2px; }

        /* ---------- the studio ---------- */
        .scene { position: relative; width: min(100%, calc((100vh - 190px) * 320 / 180)); min-width: min(100%, 560px);
            margin: 0 auto; aspect-ratio: 320 / 180; background: #1b1c2a;
            border-radius: .5rem; box-shadow: 0 2px 12px rgba(0, 0, 0, .25); }
        .scene img { image-rendering: pixelated; image-rendering: crisp-edges; }
        .scene .bg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: .5rem; }
        .npc { position: absolute; }
        .npc img { display: block; width: 100%; height: 100%; }
        .obj { position: absolute; padding: 0; margin: 0; border: 0; background: none; cursor: pointer;
            transform-origin: 50% 100%; transition: transform .15s ease-out, filter .15s ease-out; }
        .obj[data-origin="top"] { transform-origin: 50% 0; }
        .obj[data-origin="center"] { transform-origin: 50% 50%; }
        .obj img { display: block; width: 100%; height: 100%; }
        .obj.mridangam-object svg { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        .obj.partners-object svg { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        .obj.mixer-object img { image-rendering: pixelated; }
        .obj.poster-object { border: 1px solid #392f35; border-radius: 2px; background: #fff9e9;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
        .obj.poster-object img { image-rendering: auto; object-fit: contain; padding: 2px 2px 7px; }
        .poster-flag { position: absolute; right: 4%; top: 4%; width: 38%; height: 11%; min-height: 3px;
            border: 1px solid #392f35; background: linear-gradient(to right, #0055a4 0 33.333%, #fff 33.333% 66.666%, #ef4135 66.666% 100%); }
        .obj:hover, .obj:focus-visible { transform: scale(var(--z, 1.5)); z-index: 5;
            filter: drop-shadow(0 0 1px #fff8d6) drop-shadow(0 0 6px var(--glow)); }
        .obj.on-air-object:hover, .obj.on-air-object:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
        .obj:focus-visible { outline: 2px dashed #fff; outline-offset: 2px; }
        .obj .tag { position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%) scale(calc(1 / var(--z, 1.5)));
            transform-origin: 50% 100%; background: #15141d; color: #fff; font-size: .8rem; line-height: 1.2;
            padding: .2rem .5rem; border-radius: .25rem; white-space: nowrap; opacity: 0; pointer-events: none; }
        .obj[data-origin="top"] .tag { top: calc(100% + 3px); bottom: auto; transform-origin: 50% 0; }
        .obj:hover .tag, .obj:focus-visible .tag, .scene.show-all .obj .tag { opacity: 1; }
        .scene.show-all .obj .tag { font-size: 1.15rem; padding: .25rem .6rem; }
        .scene.show-all .obj { filter: drop-shadow(0 0 1px #fff8d6) drop-shadow(0 0 4px var(--glow)); }
        @media (prefers-reduced-motion: reduce) { .obj { transition: none; } }

        .guides { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin: .75rem 0; color: var(--muted);
            font-size: .95rem; }
        .guides .profile-guide { display: flex; align-items: center; padding: 0; border: 0; background: none; color: inherit;
            font: inherit; text-align: left; cursor: pointer; }
        .guides img { width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain; background: #e9eef5; border-radius: .25rem;
            vertical-align: middle; margin-right: .35rem; }
        details.list { margin-top: .5rem; }
        details.list summary { cursor: pointer; font-weight: 600; padding: .25rem 0; }
        details.list ol { padding-left: 1.4rem; margin: .25rem 0; }
        details.list li { margin: .2rem 0; }
        .linklike { font: inherit; background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline;
            cursor: pointer; text-align: left; }
        .linklike small { color: var(--muted); text-decoration: none; }

        /* ---------- story card ---------- */
        dialog { width: min(900px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); max-height: calc(100dvh - 2rem);
            border: 0; border-radius: .5rem; padding: 0; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
        #story { position: fixed; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); }
        dialog[open] { display: flex; flex-direction: column; }
        dialog::backdrop { background: rgba(15, 14, 25, .6); }
        .story-head { display: flex; gap: .75rem; align-items: flex-start; padding: 1rem 1rem .5rem; border-bottom: 1px solid var(--line); }
        .story-head .narrator { width: 64px; height: 64px; image-rendering: pixelated; object-fit: contain; background: #e9eef5; border-radius: .35rem; flex: none; }
        .story-head .who { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); margin: 0; }
        .story-head h2 { font-size: 1.25rem; margin: .1rem 0 .15rem; }
        .story-head .when { font-size: .875rem; color: var(--muted); margin: 0; }
        .story-head .close { margin-left: auto; font-size: 1.4rem; line-height: 1; border: 0; background: none; cursor: pointer; padding: .25rem .5rem; }
        .story-body { flex: 1 1 auto; min-height: 0; padding: .75rem 1rem; overflow-y: auto; }
        .story-body p { margin: 0 0 .75rem; line-height: 1.5; }
        .story-body .popup-visual { opacity: .72; transition: opacity 300ms ease; background-color: #e9eef5;
            background-image: linear-gradient(100deg, #e9eef5 20%, #f8fafc 40%, #e9eef5 60%); background-size: 200% 100%;
            animation: popup-shimmer 1.2s linear infinite; }
        .story-body img.popup-visual:not(.is-ready) { min-height: 140px; }
        .story-body .popup-visual.is-ready { opacity: 1; background: none; animation: none; }
        @keyframes popup-shimmer { to { background-position-x: -200%; } }
        @media (prefers-reduced-motion: reduce) { .story-body .popup-visual { transition: none; animation: none; } }
        .placeholder { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 140px;
            border: 2px dashed #adb5bd; border-radius: .35rem; color: var(--muted); background: #f8f9fa; margin: 0 0 .75rem;
            padding: .5rem; font-size: .9rem; }
        .story-links { display: flex; flex-wrap: wrap; gap: .5rem 1rem; font-size: .925rem; margin: 0 0 .5rem; }
        .story-video { display: block; width: 60%; max-width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: .35rem; background: #000;
            margin: 0 auto .75rem; }
        .story-collage { display: flex; width: 60%; max-width: 100%; gap: .75rem; align-items: center; justify-content: center; margin: 0 auto .75rem; }
        .story-collage img { border-radius: .35rem; max-width: 100%; height: auto; }
        .story-collage .photo { flex: 0 1 180px; }
        .story-collage .logo { flex: 0 1 140px; background: #fff; padding: .5rem; }
        .story-collage .pic { flex: 0 1 250px; }
        .partner-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin: .75rem 0; }
        .partner-card { display: flex; flex: 1 1 120px; align-items: center; justify-content: center; max-width: 150px;
            min-height: 110px; padding: .75rem; border: 1px solid var(--line); border-radius: .35rem; background: #fff;
            color: inherit; text-decoration: none; }
        .partner-card img { display: block; width: 100%; height: 82px; object-fit: contain; }
        .story-body .partner-card img.popup-visual:not(.is-ready) { min-height: 0; }
        .story-photo { display: block; width: 60%; max-width: 100%; height: auto; border-radius: .35rem; margin: 0 auto .75rem; }
        .story-photo.jose-photo { width: 40%; }
        .story-photo.naomi-photo { width: 230px; }
        .story-photo img { display: block; width: 100%; height: auto; border-radius: .35rem; }
        .story-caption { margin: 0.35rem 0 .75rem; color: var(--muted); font-size: .85rem; }
        .story-audio { display: block; width: 100%; margin: 0 0 .75rem; }
        .story-audio.photo-width-audio { width: 60%; max-width: 100%; margin: 0 auto .75rem; }
        .story-cover { display: block; width: 60%; max-width: 100%; height: auto; margin: 0 auto .75rem; border-radius: .35rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .story-journal { display: grid; width: 75%; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 1rem;
            align-items: start; justify-content: center; margin: 0 auto; }
        .story-journal.story-split { width: 90%; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
        .story-journal .story-cover { width: 100%; margin: 0; }
        .story-split > .story-photo { width: 100%; margin: 0; }
        .story-split > .story-photo.naomi-photo { width: 230px; }
        .story-split .poster-zoom { width: 100%; margin: 0 0 .4rem; }
        @media (max-width: 600px) {
            .story-journal { width: 100%; grid-template-columns: 1fr; }
            .story-journal .story-cover { width: 40%; margin: 0 auto .75rem; }
            .story-journal.story-split > .story-photo { width: 60%; margin: 0 auto .75rem; }
            .story-split > .story-photo.jose-photo { width: 40%; }
            .story-split > .story-photo.naomi-photo { width: 230px; }
        }
        .story-actions { display: flex; gap: .5rem; align-items: center; padding: .5rem 1rem 1rem; border-top: 1px solid var(--line); }
        .story-actions .hint { font-size: .8rem; color: var(--muted); }
        .poster-zoom { display: block; width: 50%; margin: 0 auto .4rem; padding: 0; border: 0; background: none; cursor: zoom-in; }
        .poster-zoom img.wac-poster { display: block; width: 100%; max-width: 100%; height: auto; margin: 0; }
        dialog.poster-preview { width: min(900px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); max-height: calc(100dvh - 2rem);
            padding: 2.75rem 1rem 1rem; background: #15141d; }
        dialog.poster-preview[open] { align-items: center; justify-content: center; }
        .poster-preview-image { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 4rem);
            max-height: calc(100dvh - 4rem); object-fit: contain; }
        .poster-preview-close { position: absolute; top: .4rem; right: .65rem; border: 0; background: none; color: #fff;
            font: inherit; font-size: 1.8rem; line-height: 1; cursor: pointer; }
    </style>
</head>

    <template id="t-cake" data-title="Blow Out the Candles, Make a Wish" data-who="j"
        data-when="Collection first shown at ISMIR 2024">
        <p>Everyone knows this tune, which makes it a perfect test for music research: many renditions of the same
            melody, on different instruments and in different languages. It is also free for everyone to use.</p>
        <p>The melody began in 1893 as <cite>Good Morning to All</cite>, by the sisters Patty and Mildred Hill; Patty ran
            a kindergarten in Louisville, Kentucky. For decades a publisher collected licence fees on the song, until
            documentary filmmaker Jennifer Nelson took the case to court in 2013. In 2015 a US judge found the copyright
            claim invalid. The song was declared public domain in the US in 2016, and its copyright expired in the
            European Union on 1 January 2017.</p>
        <p>At Hi-Audio, we felt this story deserved to be retold in the language we know best: music. So we recorded it
            together, in many voices!</p>
        <iframe class="story-video" src="https://www.youtube-nocookie.com/embed/QyY3OE6iC6w"
            title="Video: Happy Birthday, in many voices" loading="lazy"
            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <p class="story-links">
            <a href="https://hiaudio.fr/index.html?collectionid=n5hoJCqxToAMAtKwFgBide" target="_blank" rel="noopener">Listen to the collection<span class="sr-only"> (opens in a new tab)</span></a>
            <a href="https://en.wikipedia.org/wiki/Happy_Birthday_to_You" target="_blank" rel="noopener">The story of the song<span class="sr-only"> (opens in a new tab)</span></a>

        </p>

    <template id="t-cassette" data-title="Ciao Milano! 🇮🇹" data-who="g"
        data-when="November 5–9, 2023">
        <p>John Lennon recorded a home demo around 1977. In 1994, Yoko Ono gave the cassette to Paul McCartney. In 2022,
            Peter Jackson's team used machine learning to separate Lennon's voice from the piano on the demo. Later that
            year, on 30 November, ChatGPT launched, bringing a new wave of public attention to artificial intelligence.</p>
        <p>Nearly a year later, just days before ISMIR 2023, The Beatles released <cite>Now and Then</cite>, bringing
            Lennon's voice back to listeners. The following week, Hi-Audio was presented at ISMIR in Milan. As the race
            to bring AI and music together gathered pace, Hi-Audio set out to contribute a collaborative platform and
            data open to research. <em>Nobody said it was easy... No one ever said it would be this fun!</em></p>
        <img class="story-photo" src="https://adasp.telecom-paris.fr/rc/posts/hiaudio_summary/ismir2023.jpg" loading="lazy"
            alt="Hi-Audio presented at the ISMIR 2023 Late-Breaking Demo session in Milan">

    <template id="t-organ" data-title="Music made by machine, powered by hand" data-who="j"
        data-when="4 November 2023 · Place de la Victoire, Palaiseau">
        <p>The other end of music technology: an <span lang="fr">orgue de
                Barbarie</span>, or barrel organ. The player turns a crank; bellows push air through the pipes, and the
            tune is stored mechanically, as pins on a barrel or holes punched in a paper roll or a folded cardboard book. 
            Chantal's street performance was filmed and its sound uploaded to Hi-Audio as field data: a real outdoor
            recording, street noise included.</p>

    <template id="t-mridangam" data-title="A Rhythmic Journey to India" data-who="j" data-when="June 2024">
        <p>When Vishal Nagarajan joined Télécom Paris as a research engineer on the AUDIBLE project, he brought more than his technical expertise: he also brought his calm presence, his savoir-faire, and  his mridangam. During an informal “free-lunch” session, he introduced the ADASP group to the instrument, sharing its sounds, techniques, and cultural context. We discovered not just a percussion instrument, but a rich musical tradition and a different way of thinking about rhythm from the classical Western music many of us knew. In June 2024, Vishal recorded his mridangam on Hi-Audio so others could listen, too. Thanks for this opportunity, Vishal!</p>
        <img class="story-photo" src="./images/mridangam.jpg" width="4080" height="3072" loading="lazy"
            alt="Vishal Nagarajan wearing headphones beside a mridangam during a recording session">
        <audio class="story-audio photo-width-audio" src="./audio/mridangam.mp3" controls preload="none">
            Your browser does not support audio playback.
        </audio>
        <details class="list">
            <summary>Know more: Mridangam &amp; the Art of Konakkol</summary>
            <h3>Mridangam</h3>
            <ul>
                <li><strong>Instrument:</strong> A classical South Indian percussion instrument central to Carnatic music.</li>
                <li><strong>Construction:</strong> Made from a single block of jackfruit wood, it has a barrel shape and two drumheads:
                    <ul>
                        <li>Left head (Thoppi/Bass head)</li>
                        <li>Right head (Valanthalai/Treble head), whose multiple leather layers include a black paste called “soru” for tuning and tonal quality.</li>
                    </ul>
                </li>
                <li><strong>Playing technique:</strong> Played with both hands using fingers for varied strokes, while seated with the instrument horizontally across the lap.</li>
                <li><strong>Role in music:</strong> Accompanies vocalists and instrumentalists in Carnatic concerts. Solo performances, called “Thani Avarthanam,” showcase rhythmic improvisation.</li>
                <li><strong>Tuning:</strong> Leather straps or metal blocks adjust the pitch: tightening raises it and loosening lowers it. The left head is tuned to the tonic an octave lower, and larger instruments have a lower pitch.</li>
            </ul>
            <h3>Konakkol</h3>
            <ul>
                <li><strong>Definition:</strong> Vocal percussion in Carnatic music, using syllables to represent rhythmic patterns.</li>
                <li><strong>Syllables (Solkattu):</strong> Examples include “ta,” “dhi,” “tom,” “na,” “ki,” and “ta-ri-ki-ta.”</li>
                <li><strong>Rhythmic cycles (Talas):</strong> Adi tala (8 beats), Rupaka tala (6 beats), and Misra Chapu (7 beats).</li>
                <li><strong>Rhythmic patterns (Jatis):</strong> Tishra (3 beats), Chatushra (4 beats), Khanda (5 beats), Misra (7 beats), and Sankeerna (9 beats).</li>
            </ul>
            <p><strong>Purpose:</strong> Konakkol helps musicians internalize complex rhythms and collaborate.</p>
        </details>
        <p class="story-links">
            <a href="https://hiaudio.fr/composition.html?compositionId=WKyQpEJ5Y3Nerv6BRN52Y5" target="_blank" rel="noopener">Listen in Hi-Audio<span class="sr-only"> (opens in a new tab)</span></a>
            <a href="https://en.wikipedia.org/wiki/Mridangam" target="_blank" rel="noopener">About the mridangam<span class="sr-only"> (opens in a new tab)</span></a>
        </p>
    </template>

    <template id="t-profile-gael" data-title="Researcher, professor and trumpeter" data-who="g" data-when="Profile">
        <p>Gaël Richard joined Télécom Paris in 2001 and is now Full Professor of Audio Signal Processing. He is also the Scientific Director of <a href="https://hi-paris.fr/" target="_blank" rel="noopener"><em>Hi! PARIS</em><span class="sr-only"> (opens in a new tab)</span></a>, the interdisciplinary center for AI and data analytics.</p>
        <p>His research focuses on machine learning for speech, audio and music. He has co-authored more than 300 papers and is named on 10 patents. A Fellow of IEEE and ELLIS, he received the IMT–National Academy of Science Grand Prize in 2020. In 2022, he received an Advanced Grant from the European Research Council for HI-AUDIO, a project on artificial intelligence for sound.</p>
        <p>A formally trained musician and experienced trumpeter, Gaël brings an experienced performer’s perspective to the project.</p>

    <template id="t-piano" data-title="A Lesson for Your Ears" data-who="j" data-when="June 2024">
        <p>In summer 2024, our colleague Matteo Gionfriddo was working on a separate research project for his master’s thesis,
            <a href="https://www.politesi.polimi.it/handle/10589/227430" target="_blank" rel="noopener"><cite>Controllable music generation with neural discrete representations and a multitrack MIDI-to-audio dataset</cite><span class="sr-only"> (opens in a new tab)</span></a>.
            His project created Audio909 by using a self-playing upright piano—a kind of “ghost player”—to turn existing MIDI pieces into acoustic recordings.
            The piano, microphones, and studio were already set up for his experiments. At Hi-Audio, we value the human touch in music, so we invited Tetiana Viktory, one of Télécom Paris’s piano teachers, to register on the platform and record her own performances.
            You can listen to her beautiful recordings below; they are part of the Hi-Audio corpus. Matteo’s thesis and Tetiana’s recordings were separate projects; nevertheless, the shared studio setup was a fortunate and wonderful coincidence.</p>
        <img class="story-photo" src="./images/tetiana_viktory.jpg" width="1024" height="768" loading="lazy"
            alt="Tetiana Viktory, wearing headphones, playing an upright Yamaha piano with microphones set up in the Télécom Paris studio">
        <audio class="story-audio photo-width-audio" src="./audio/tetiana_two.mp3" controls preload="none">
            Your browser does not support audio playback.
        </audio>
        <details class="list">
            <summary>About Tetiana</summary>
            <h3>Pianist, composer, and educator</h3>
            <p>Tetiana Viktory is a pianist and composer, and a graduate of the National Music Academy of Ukraine in Kyiv. A laureate of international competitions, she has recorded chamber and orchestral music and taught piano for more than 20 years.</p>
            <h3>A meeting of musical worlds</h3>
            <p>Her work brings Ukrainian and European music into conversation with her own compositions, combining classical traditions with contemporary influences and introducing audiences to Ukrainian music.</p>
            <h3>Music across borders</h3>
            <p>Alongside solo performances, Tetiana has performed with orchestras and collaborated with instrumentalists and singers. Since 2022, she has taught at the Artima Association and Télécom Paris and continued her concert work in France.</p>
            <p>Her music highlights Ukrainian culture, builds cultural connections, and expresses support for peace and reconstruction in Ukraine.</p>
        </details>

    <template id="t-moon" data-title="The First Human Voice Recording? A Song for Children" data-who="g"
        data-when="Recorded 1860 · heard again 2008 · our workshop, 29 April 2025">
        <p>No “one, two, three”; no “check, check.” The earliest known intelligible recording of a human voice captured
            a song: <cite lang="fr">Au clair de la lune</cite>, a beloved French folk song familiar to generations of
            children. In 1860, Édouard-Léon Scott de Martinville recorded a singer with his phonautograph, a machine that
            traced sound waves on paper but could not play them back. In
            2008, the <a href="https://www.firstsounds.org/research/scott.php" target="_blank" rel="noopener">First Sounds</a>
            group turned the drawing into sound. Played at the right speed, the singer is a man, possibly Scott himself.
            This earliest musical recording we can hear reminds us that music was part of recorded sound from the start.
            Capturing music is at the heart of what we do at Hi-Audio, so we wanted to honor this milestone in the history of
            audio technology.</p>
        <div class="story-collage">
            <img class="pic" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/T6-_d640_-_Fig._468._%E2%80%94_L%C3%A9on_Scott.png/250px-T6-_d640_-_Fig._468._%E2%80%94_L%C3%A9on_Scott.png"
                loading="lazy" alt="19th-century engraving of Édouard-Léon Scott de Martinville">
            <img class="pic" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Phonautograph_1909.jpg/250px-Phonautograph_1909.jpg"
                loading="lazy" alt="A phonautograph, photographed in 1909">
        </div>
        <p>That April 2025 tribute came to life at our <a href="https://hi-audio.imt.fr/agenda/29th-april-music-workshop/" target="_blank" rel="noopener">Télécom Paris workshop</a>, where musicians recorded their own version together on Hi-Audio.</p>
        <audio class="story-audio" controls preload="none" src="https://hi-audio.imt.fr/wp-content/uploads/2026/04/AuClairDeLaLune.mp3"
            aria-label="Au clair de la lune, recorded at the Télécom Paris workshop">
            Your browser does not support the audio element. <a href="https://hi-audio.imt.fr/wp-content/uploads/2026/04/AuClairDeLaLune.mp3">Download the recording</a>.
        </audio>
        <p class="story-links">
            <a href="https://hiaudio.fr/composition.html?compositionId=hwu7tp3yS2uebqkLCMun43" target="_blank" rel="noopener">Listen to the multitrack version<span class="sr-only"> (opens in a new tab)</span></a>
            <a href="https://en.wikipedia.org/wiki/%C3%89douard-L%C3%A9on_Scott_de_Martinville" target="_blank" rel="noopener">The 1860 recording<span class="sr-only"> (opens in a new tab)</span></a>
        </p>
    </template>

    <template id="t-wac" data-title="Bonjour WAC!" data-who="g"

                <p>On 19–21 November 2025, the Web Audio Conference returned to <a href="https://www.ircam.fr/en" target="_blank" rel="noopener">IRCAM<span class="sr-only"> (opens in a new tab)</span></a> in Paris—the venue of the first WAC in 2015—for its ninth edition and 10th anniversary.</p>
                <p>Hi-Audio brought a new method for estimating round-trip latency in online DAWs, developed in our lab and ready to share with the web-audio community. The article, entitled <cite>A Maximum Length Sequence–Based Method for Robust Round-Trip Latency Estimation in Online Digital Audio Workstations</cite>, received a Best Poster Award in the short-paper category.</p>

    <template id="t-radio" data-title="On air: FLO, the Female Laptop Orchestra" data-who="j"
        data-when="13 February – 13 March 2026">
        <p>Near the close of WAC 2025, Jose met Nela Brown, Director of FLO Lab. They promised to keep in touch—and did.
            Over the months that followed, their conversation grew into Hi-Audio’s first collaboration with the Female
            Laptop Orchestra.</p>
        <p>Early in 2026, nine brave performers, based in nine countries, recorded 16 tracks on Hi-Audio without meeting
            in a room, then mixed them for the Radiophrenia 2026 festival
            (87.9 FM in Glasgow, and online).</p>
        <p>The practice-based study, led by Nela Brown, Director of FLO Lab, found what works (nothing to install, easy
            onboarding) and what professional musicians still miss. Those insights can help bring us closer to music
            without borders, where artists can create together across time zones, cultures, and continents.</p>
        <figure class="story-photo">
            <img src="https://i0.wp.com/femalelaptoporchestra.org/wp-content/uploads/2024/10/female-laptop-orchestra_is2-2024_telematic-city-jam-erlangen_zoom-after-performance.png"
                alt="Female Laptop Orchestra performing remotely in a Zoom call after the Telematic City Jam Erlangen">
            <figcaption class="story-caption">Female Laptop Orchestra_IS2 2024_Telematic City Jam Erlangen_Zoom after performance. Source: <a href="https://femalelaptoporchestra.org/" target="_blank" rel="noopener">Female Laptop Orchestra</a></figcaption>
        </figure>
        <details class="list">
            <summary>About FLO and the composition</summary>
            <h3>From This World to...</h3>
            <p>Conceived as a fixed composition for Radiophrenia, the final mix was scheduled for submission on 7 March 2026. The piece asks: “We are sending a message into space. By the time it reaches anyone out there, we may be extinct. What would you want to say?”</p>
            <p>Each performer answers in their mother tongue. Their spoken words are processed through an ethical AI tool to create the base track. FLO performers around the world then use the open-source Hi-Audio platform to add musical tracks asynchronously, building on the composition together.</p>
            <p>Through this process, the musicians explore the state of our world and humanity’s place on Earth and in the universe: our hopes for the future, our pride and disappointments, our cultures, and our values.</p>
            <p>Founded in 2014 by Nela Brown, the Female Laptop Orchestra is an international ensemble of professional musicians, visual artists, and researchers working at the intersection of music, technology, and distributed audiovisual performance. By crossing time zones, continents, political borders, and languages, FLO explores intercultural collaboration at a distance and raises awareness of the underrepresentation of women in sound and music computing.</p>
        </details>
        <p class="story-links">
            <a href="https://idsinge.github.io/hiaudio_FLO_practice-based_evaluation/" target="_blank" rel="noopener">Study results<span class="sr-only"> (opens in a new tab)</span></a>
            <a href="https://radiophrenia.scot/calendar/1107-2/" target="_blank" rel="noopener">Radiophrenia<span class="sr-only"> (opens in a new tab)</span></a>
        </p>
    </template>

    <template id="t-headphones" data-title="Hi-Audio puts itself to the test" data-who="g"
        data-when="November – December 2025">
        <p>In a <a href="https://hi-audio.imt.fr/agenda/user-evaluation-test/" target="_blank" rel="noopener">preliminary user evaluation study</a> organised with La Scène, the music association of Télécom Paris, 22 participants completed ten
            tasks: recording, annotation, collaboration and latency measurement. 72% of task attempts succeeded.</p>
        <p>Recording worked for everyone; annotation and collaboration controls were harder to find. The usability score
            (SUS) was 55.8 out of 100, “marginal”: a clear list of what to fix next.</p>
        <p>The results of this preliminary evaluation were also included in the journal article.</p>

            const sceneItems = Array.from(scene.querySelectorAll('.obj')).sort(visualOrder);

            document.addEventListener('keydown', function (event) {
                const directions = {
                    ArrowUp: { primary: 'y', sign: -1 },
                    ArrowDown: { primary: 'y', sign: 1 },
                    ArrowLeft: { primary: 'x', sign: -1 },
                    ArrowRight: { primary: 'x', sign: 1 }
                };
                const direction = directions[event.key];
                if (!direction || dlg.open) return;
                const focusedEditor = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]');
                if (focusedEditor) return;
                const focusedItem = event.target instanceof Element && event.target.closest('.obj');
                const current = focusedItem || (document.activeElement === document.body ? sceneItems[0] : null);
                if (!current) return;

                event.preventDefault();
                const sceneWidth = scene.clientWidth;
                const sceneHeight = scene.clientHeight;
                const center = item => ({
                    x: (parseFloat(item.style.left) + parseFloat(item.style.width) / 2) * sceneWidth / 100,
                    y: (parseFloat(item.style.top) + parseFloat(item.style.height) / 2) * sceneHeight / 100
                });
                const currentCenter = center(current);
                const candidates = sceneItems
                    .filter(item => item !== current)
                    .map(item => {
                        const itemCenter = center(item);
                        const dx = itemCenter.x - currentCenter.x;
                        const dy = itemCenter.y - currentCenter.y;
                        const primary = direction.primary === 'x' ? dx : dy;
                        const perpendicular = direction.primary === 'x' ? dy : dx;
                        return { item, primary, perpendicular };
                    })
                    .filter(candidate => candidate.primary * direction.sign > 0)
                    .sort((a, b) =>
                        (Math.abs(a.primary) + Math.abs(a.perpendicular) * 2) -
                        (Math.abs(b.primary) + Math.abs(b.perpendicular) * 2)
                    );

            });

            document.addEventListener('keydown', function (event) {
                if (!dlg.open || !dlg.dataset.audio || (event.code !== 'Space' && event.key !== ' ')) return;
                const focusedEditor = event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable="true"]');
                if (focusedEditor) return;
                event.preventDefault();
                if (event.repeat) return;
                toggleCustomAudioPause();
            });

            function speakWithBrowserVoice(button) {
                if (!synth) { document.getElementById('story-hint').textContent = 'No voice available in this browser.'; return; }
                if (synth.speaking) { stopPlayback(); return; }
                if (storyAudio) storyAudio.pause();
                const text = document.getElementById('story-title').textContent + '. ' +
                    Array.from(document.querySelectorAll('#story-body p:not(.story-links)')).map(p => p.textContent.replace(/\s+/g, ' ').trim()).join(' ');
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-GB';
                const voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
                if (voices.length) u.voice = voices[(dlg.dataset.who === 'g' ? 1 : 0) % voices.length];
                u.onend = stopPlayback;
                synth.speak(u);
                button.textContent = 'Stop';
            }

            document.getElementById('story-browser-voice').addEventListener('click', function () {
                if (synth && synth.speaking) { stopPlayback(); return; }
                if (!storyAudio.paused) stopPlayback();
                speakWithBrowserVoice(this);
            });

            document.querySelectorAll('.story-custom-audio').forEach(function (audio) {
                audio.addEventListener('ended', stopPlayback);
            });

            document.querySelectorAll('[data-story]').forEach(function (el) {
                el.addEventListener('click', function () { openStory(el.dataset.story, el); });
            });

            if (window.matchMedia('(max-width: 600px)').matches) document.querySelector('details.list').open = true;
            const toggle = document.getElementById('show-all');
            toggle.addEventListener('click', function () {
                const on = toggle.getAttribute('aria-pressed') !== 'true';
                toggle.setAttribute('aria-pressed', String(on));
                scene.classList.toggle('show-all', on);
            });
        })();
    </script>
</body>

</html>
